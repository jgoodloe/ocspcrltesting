# zizmor configuration for the workflow-lint job (#80).
rules:
  # All actions are hash-pinned (#80); zizmor now enforces that any new or
  # edited `uses:` is pinned too. Dependabot keeps the SHAs fresh.

  # pip/npm/buildx caches in build.yml: GitHub's cache scoping isolates PR
  # caches from main/tag runs (a PR cache can never be read by a release
  # build), so the poisoning path zizmor warns about is not reachable.
  cache-poisoning:
    ignore:
      - build.yml

  # Flags softprops/action-gh-release as replaceable by the runner's `gh`
  # CLI. True, but the action is proven (v1.1.0) — revisit with #80.
  superfluous-actions:
    ignore:
      - build.yml

  # workflow_run is privileged, but ci-health checks out nothing, executes
  # no code from the triggering ref, and passes event fields via env — it
  # only reads the run's conclusion and files/closes an issue.
  dangerous-triggers:
    ignore:
      - ci-health.yml
      # workflow_run here only gates on the triggering run's conclusion; the
      # jobs check out main (not the triggering ref) and run no PR code.
      - image-scan.yml
