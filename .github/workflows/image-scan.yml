# Container and config scanning (#77): three scans that cover what neither
# CodeQL (our code) nor Dependabot (declared deps + base-image tags) watches.
#
#   trivy-image  — OS packages inside the published `latest` image (the
#                  Debian layer of python:*-slim). ignore-unfixed keeps the
#                  signal actionable: findings appear only once Debian ships
#                  a fixed package, i.e. when rebuilding actually helps.
#   trivy-config — IaC misconfigurations in the Dockerfile and
#                  docker-compose.yml (privileged containers, missing
#                  healthchecks, root users, ...).
#   hadolint     — Dockerfile best-practice linting (unpinned bases, RUN
#                  hygiene, apt cache handling).
#
# All three upload SARIF to the Security tab under their own category.
# Official tool containers are used instead of marketplace actions: fewer
# third-party dependencies to hash-pin and audit.
name: image-scan

# Rebuild-on-patch loop: when the weekly scheduled scan finds FIXABLE
# critical CVEs in `latest`, it dispatches a rebuild of the build pipeline —
# pip re-resolves patched packages and the Dockerfile's apt upgrade layer
# pulls patched Debian packages — and every completed build on main is
# scanned again via the workflow_run trigger, closing the loop. Only
# scheduled scans dispatch rebuilds (at most one a week), so a dependency
# whose fix cannot land (e.g. capped by a floor) alerts via issue instead of
# rebuilding in circles.
on:
  schedule:
    - cron: "31 6 * * 1"
  # Scan every image the build pipeline publishes from main, as soon as it
  # is pushed (this also re-scans after a CVE-triggered rebuild).
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-image:
    runs-on: ubuntu-latest
    # Don't scan after failed builds (the image didn't change).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      security-events: write
      issues: write
      # To dispatch the rebuild of build.yml.
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Scan ghcr latest image
        run: |
          docker run --rm -v "$PWD:/out" aquasec/trivy:latest image \
            --format sarif --output /out/trivy.sarif \
            --severity CRITICAL,HIGH,MEDIUM --ignore-unfixed \
            ghcr.io/${{ github.repository }}:latest

      - name: Rebuild when critical fixes are available
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/out" aquasec/trivy:latest image \
            --severity CRITICAL --ignore-unfixed \
            --format json --output /out/crit.json \
            "ghcr.io/$GH_REPO:latest"
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' crit.json)
          echo "fixable CRITICAL findings in latest: $count"
          gh label create cve-rebuild --description "Image rebuilds triggered by patched CVEs" --color B60205 --force
          existing=$(gh issue list --label cve-rebuild --state open --json number --jq '.[0].number // empty')
          if [ "$count" -eq 0 ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "The published image no longer contains fixable critical CVEs."
            fi
            exit 0
          fi
          {
            echo "Trivy found **$count fixable CRITICAL** vulnerabilities in \`ghcr.io/$GH_REPO:latest\`:"
            echo
            echo '| CVE | package | installed | fixed in |'
            echo '|---|---|---|---|'
            jq -r '[.Results[]?.Vulnerabilities[]? | "| \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "?") |"] | unique | .[]' crit.json
          } > body.md
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            echo "" >> body.md
            echo "A rebuild of \`latest\` has been dispatched to pick up the patched packages; the post-build scan will close this issue if it comes back clean. If this issue persists, the fix cannot be picked up automatically (e.g. a version floor caps below it) and needs a look." >> body.md
            gh workflow run build.yml --ref main
          else
            echo "" >> body.md
            echo "This scan ran after a build, so no automatic rebuild was dispatched (the weekly scan handles that); if these persist, a dependency change is needed." >> body.md
          fi
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "Fixable critical CVEs in the published image" --body-file body.md --label cve-rebuild
          fi

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  config-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Trivy config scan (Dockerfile, docker-compose)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest config \
            --format sarif --output /repo/trivy-config.sarif /repo

      - name: Upload trivy config results
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Hadolint (Dockerfile lint)
        # --no-fail: findings belong in the Security tab, not a red run.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint \
            hadolint --format sarif --no-fail Dockerfile > hadolint.sarif

      - name: Upload hadolint results
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: hadolint.sarif
          category: hadolint
