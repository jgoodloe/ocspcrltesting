# Documented scan exceptions, consumed by the release CVE gate and the
# image scans via --ignorefile. Each entry must carry a statement that
# survives an audit; delete entries when they stop being true.
vulnerabilities:
  # setuptools path traversal in PackageIndex.download() (easy_install
  # machinery). The only setuptools<78.1.1 in the image is the version pin
  # inside pip's _vendor/vendor.txt — pip vendors ONLY setuptools'
  # pkg_resources module, so the vulnerable PackageIndex code is not present
  # in the artifact; even the newest pip (26.3) still pins setuptools 70.3.0
  # there. The real, importable setuptools in site-packages is floored at
  # >=78.1.1 in backend/requirements.txt, which this ignore does not affect
  # version-wise: if the floor were ever lowered, the gate's table would
  # still show the package, so revisit this entry if requirements change.
  - id: CVE-2025-47273
    statement: >-
      Flagged copy is pip's vendored setuptools pin (pkg_resources only);
      the vulnerable PackageIndex module is not shipped. Site-packages
      setuptools is floored at >=78.1.1.
